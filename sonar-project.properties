# Configuración para análisis con SonarQube / SonarScanner
sonar.projectKey=crud-productos-python
sonar.projectName=CRUD Productos Python
sonar.projectVersion=1.0

# Codificación y fuentes
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=test_*.py,venv/**,.git/**,__pycache__/**

# Pruebas unitarias
sonar.tests=.
sonar.test.inclusions=test_*.py

# Lenguaje
sonar.language=py
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
